<body>
  <div class="wrap">
    <div class="card">
      <h1 style="margin:0 0 8px; font-size: 24px;">經夠盃挑戰</h1>
      <p class="muted">聖經經文快問快答：選擇難度與題庫範圍，挑戰高分、爭取排行榜名次。</p>
      
      <div id="status-area" style="margin: 15px 0; padding: 10px; background: #f3f4f6; border-radius: 8px; font-size: 14px;">
        正在準備遊戲環境...
      </div>

      <a class="btn" href="#" id="start-btn" style="opacity: 0.5; pointer-events: none;">進入遊戲</a>
      
      <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
        <p class="muted" style="font-size: 12px;">若遇到無法載入或排版問題，請點擊下方修復按鈕：</p>
        <button onclick="fixApp()" style="background: #9ca3af; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">強制修復</button>
      </div>

      <noscript>
        <p class="muted" style="margin-top:10px;">您的瀏覽器停用 JavaScript，請手動點擊上方「進入遊戲」。</p>
      </noscript>
    </div>
  </div>
  
  <script>
    // 手動修復功能
    function fixApp() {
      var status = document.getElementById('status-area');
      status.style.display = 'block';
      status.innerHTML = '正在清除舊版快取...';
      
      nuke().then(function(){
        status.innerHTML = '<span style="color:green">✓ 系統已重置</span><br>請點擊上方「進入遊戲」按鈕。';
        enableBtn();
      });
    }

    function nuke() {
      var p1 = Promise.resolve();
      if ('serviceWorker' in navigator) {
        p1 = navigator.serviceWorker.getRegistrations().then(function(regs) {
          var promises = [];
          for(var i=0; i<regs.length; i++) promises.push(regs[i].unregister());
          return Promise.all(promises);
        });
      }
      
      var p2 = Promise.resolve();
      if ('caches' in window) {
        p2 = caches.keys().then(function(names) {
          return Promise.all(names.map(function(name) { return caches.delete(name); }));
        });
      }
      return Promise.all([p1, p2]);
    }

    function enableBtn() {
      var btn = document.getElementById('start-btn');
      if(btn) {
        btn.href = './bible-challenge.html?t=' + Date.now() + '&r=' + Math.random();
        btn.style.opacity = '1';
        btn.style.pointerEvents = 'auto';
        var status = document.getElementById('status-area');
        if(status) status.innerHTML = '準備就緒！請點擊按鈕進入。';
      }
    }

    // 自動執行：進入首頁時，自動清除 SW 與快取，確保環境乾淨
    (function(){
       nuke().then(function(){
         console.log('Environment cleaned.');
         // Delay slightly to ensure browser registers the unregister
         setTimeout(enableBtn, 500);
       });
    })();
  </script>
